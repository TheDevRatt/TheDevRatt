  </g>

  <g filter="url(#glow)">
    <text x="600" y="215" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="86" font-weight="800" letter-spacing="3" fill="#F8FAFC">TheDevRatt</text>
    <text x="600" y="264" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#7DD3FC">ANIME UI GREMLIN • GAME DEV SIDE QUESTS • C# / TS</text>
