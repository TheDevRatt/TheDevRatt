<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TheDevRatt anime arcade profile banner</title>
  <desc id="desc">A neon anime inspired night-sky game menu banner for TheDevRatt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10002B"/>
      <stop offset="0.38" stop-color="#240046"/>
      <stop offset="0.72" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#001219"/>
    </linearGradient>
    <radialGradient id="moon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1004 94) rotate(90) scale(95)">
      <stop offset="0" stop-color="#FFF7AD"/>
      <stop offset="0.62" stop-color="#FFD6FF"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="140" y1="86" x2="1048" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19002E" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#1D1144" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#052437" stop-opacity="0.84"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#7DD3FC" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="34" fill="url(#grid)"/>

  <circle cx="1004" cy="94" r="96" fill="url(#moon)" opacity="0.95"/>
  <circle cx="1032" cy="78" r="76" fill="#12002A" opacity="0.72"/>

  <g opacity="0.85">
    <path d="M71 338C174 260 263 266 366 326C485 395 572 362 673 303C793 232 890 235 1014 309C1084 350 1130 353 1172 343V420H71V338Z" fill="#050816" opacity="0.78"/>
